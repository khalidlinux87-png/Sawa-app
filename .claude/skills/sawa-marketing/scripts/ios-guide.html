<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Plex;font-weight:400;src:url(FONTS/plex-arabic-400.woff2) format("woff2")}
@font-face{font-family:Plex;font-weight:700;src:url(FONTS/plex-arabic-700.woff2) format("woff2")}
@font-face{font-family:PlexL;font-weight:400;src:url(FONTS/plex-latin-400.woff2) format("woff2")}
@font-face{font-family:PlexL;font-weight:700;src:url(FONTS/plex-latin-700.woff2) format("woff2")}
:root{--gold:#F4C35A;--ios:#007AFF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2559ad}
body{font-family:PlexL,Plex,sans-serif;color:#fff}
#bg{position:absolute;inset:-200px;background:linear-gradient(160deg,#2559ad 0%,#2F80C8 45%,#2BA59A 100%)}
.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
svg{display:block}

/* ---------- phone mockup (600x1240 screen) ---------- */
.phone{position:absolute;width:628px;height:1268px;border:14px solid #0d1b2e;border-radius:86px;background:#000;box-shadow:0 40px 120px rgba(5,20,50,.45);overflow:hidden;color:#111}
.scr{position:absolute;inset:0;border-radius:72px;overflow:hidden;background:#fff}
.lay{position:absolute;inset:0}
.status{position:absolute;left:0;right:0;top:0;height:70px;display:flex;justify-content:space-between;align-items:center;padding:14px 56px 0;font:700 26px PlexL,sans-serif;color:#111;z-index:5;direction:ltr}
.island{position:absolute;left:50%;top:16px;width:190px;height:52px;margin-left:-95px;border-radius:30px;background:#000;z-index:6}
.page{position:absolute;left:0;right:0;top:70px;bottom:200px;overflow:hidden;background:#fff}
.page img{position:absolute;width:640px;left:-16px;top:-16px}
.bar{position:absolute;left:0;right:0;bottom:0;height:200px;background:rgba(246,246,248,.97);border-top:1px solid #d9d9de;direction:ltr}
.url{position:absolute;left:28px;right:28px;top:16px;height:66px;border-radius:20px;background:#e6e6ea;display:flex;align-items:center;justify-content:center;gap:10px;font:400 28px PlexL,sans-serif;color:#111}
.tools{position:absolute;left:40px;right:40px;top:100px;height:70px;display:flex;justify-content:space-between;align-items:center;color:var(--ios)}
.tgt{position:relative;display:flex;align-items:center;justify-content:center}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:900px;background:#f2f2f7;border-radius:40px 40px 0 0;padding:26px 26px 0}
.shead{display:flex;align-items:center;gap:18px;padding:6px 8px 22px;border-bottom:1px solid #d8d8dc}
.shead img{width:70px;height:70px;border-radius:16px}
.shead b{display:block;font-size:30px}
.shead small{font:400 24px PlexL,sans-serif;color:#8a8a8e}
.apps{display:flex;gap:30px;padding:24px 8px}
.apps i{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#d6d9e0,#b9bec9);display:block}
.grp{background:#fff;border-radius:22px;overflow:hidden;margin-top:8px}
.row{position:relative;height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:30px;border-bottom:1px solid #e5e5ea;color:#111}
.row:last-child{border-bottom:0}
.row .ic{color:#111;opacity:.8}
.row.hl{background:#fff7e0}
.addp{position:absolute;inset:0;background:#f2f2f7}
.nav{position:absolute;left:0;right:0;top:80px;height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:30px}
.nav span{color:var(--ios)}
.nav b{font-size:30px;color:#111}
.card{position:absolute;left:30px;right:30px;top:210px;background:#fff;border-radius:24px;padding:26px;display:flex;gap:26px;align-items:center}
.card img{width:130px;height:130px;border-radius:30px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card .f{flex:1}
.card .f div{font-size:34px;font-weight:700;padding-bottom:14px;border-bottom:1px solid #e5e5ea;color:#111}
.card .f small{display:block;font:400 22px PlexL,sans-serif;color:#8a8a8e;margin-top:14px;direction:ltr;text-align:start}
.tog{position:absolute;left:30px;right:30px;top:440px;height:96px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:30px;color:#111}
.sw{width:96px;height:58px;border-radius:30px;background:#34C759;position:relative}
.sw:after{content:"";position:absolute;top:4px;right:4px;width:50px;height:50px;border-radius:50%;background:#fff}
.home{position:absolute;inset:0;background:linear-gradient(170deg,#1f3b73,#3a6fb6 55%,#5fb3a8)}
.grid{position:absolute;left:44px;right:44px;top:130px;display:grid;grid-template-columns:repeat(4,1fr);gap:44px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;font:400 22px Plex,PlexL,sans-serif;color:#fff}
.app i{width:112px;height:112px;border-radius:28px;background:rgba(255,255,255,.28);display:block}
.app img{width:112px;height:112px;border-radius:28px;background:#fff;display:block}
.sawa img{box-shadow:0 0 0 8px var(--gold),0 10px 30px rgba(0,0,0,.35)}
.sawa span{font-weight:700}
.dock{position:absolute;left:28px;right:28px;bottom:28px;height:160px;border-radius:50px;background:rgba(255,255,255,.25);display:flex;justify-content:space-around;align-items:center}
.dock i{width:112px;height:112px;border-radius:28px;background:rgba(255,255,255,.35);display:block}
.tap{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:8px solid var(--gold);background:rgba(244,195,90,.22);pointer-events:none;z-index:9;opacity:0}

/* ---------- video layout ---------- */
#vid .phone{left:226px;top:600px}
#vid,#img{position:absolute;inset:0}
#intro,#outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
#intro img{width:300px;height:300px;border-radius:70px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.3)}
#intro h1{font-size:110px;line-height:1.2;margin-top:50px}
#intro p{font-size:52px;margin-top:20px;opacity:.95}
#hdr{position:absolute;left:60px;right:60px;top:90px;height:450px}
.st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0}
.num{width:110px;height:110px;border-radius:50%;background:var(--gold);color:#16325c;font-size:66px;font-weight:700;display:flex;align-items:center;justify-content:center}
.st h2{font-size:62px;line-height:1.25;margin-top:22px}
.st p{font-size:38px;opacity:.9;margin-top:10px}
#dots{position:absolute;left:0;right:0;top:548px;display:flex;justify-content:center;gap:18px}
#dots i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
#dots i.on{background:#fff;width:56px;border-radius:11px}
#outro h2{font-size:70px;line-height:1.3}
#outro p{font-size:46px;margin-top:22px;opacity:.95;line-height:1.45}
#outro .cta{margin-top:50px;background:#fff;color:#2F6FC4;font-weight:700;font-size:50px;border-radius:999px;padding:24px 60px}
#outro .ph{position:relative;width:628px;height:1268px;transform:scale(.62);margin:-240px 0 -250px}
#outro .ph .phone{left:0;top:0}

/* ---------- static image ---------- */
#img{display:none;position:absolute;inset:0}
body.still #img{display:block}
body.still #vid{display:none}
#ihead{position:absolute;left:60px;right:60px;top:70px;display:flex;align-items:center;gap:34px}
#ihead img{width:150px;height:150px;border-radius:36px;background:#fff}
#ihead h1{font-size:70px;line-height:1.15}
#ihead p{font-size:36px;opacity:.95;margin-top:8px}
#cells{position:absolute;left:40px;right:40px;top:300px;display:grid;grid-template-columns:1fr 1fr;gap:20px 20px}
.cell{height:700px;position:relative;background:rgba(255,255,255,.1);border-radius:40px;overflow:hidden}
.cell .wrap{position:absolute;left:50%;top:205px;width:628px;height:1268px;margin-left:-314px;transform:scale(.39);transform-origin:50% 0}
.cell .wrap .phone{left:0;top:0}
.cell .cap{position:absolute;left:24px;right:24px;top:26px;display:flex;gap:18px;align-items:flex-start}
.cell .num{width:66px;height:66px;font-size:40px;flex:none}
.cell .cap b{font-size:33px;line-height:1.28;display:block}
.cell .cap small{font-size:25px;opacity:.9;display:block;margin-top:4px}
#ifoot{position:absolute;left:60px;right:60px;bottom:58px;text-align:center;font-size:36px;line-height:1.5}
#ifoot b{color:var(--gold)}
</style>
</head>
<body>
<div id="bg"><div class="orb" id="o1" style="width:900px;height:900px;left:-300px;top:-250px"></div><div class="orb" style="width:700px;height:700px;right:-250px;bottom:-200px"></div></div>
<div id="vid">
  <div id="intro"><img class="logo"><h1></h1><p></p></div>
  <div id="hdr"></div><div id="dots"></div>
  <div id="stage"></div>
  <div id="outro"><div class="ph"></div><h2></h2><p></p><div class="cta"></div></div>
</div>
<div id="img"><div id="ihead"><img class="logo"><div><h1></h1><p></p></div></div><div id="cells"></div><div id="ifoot"></div></div>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const I={
 share:'<svg width="44" height="54" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v16M6.5 7.5 12 2l5.5 5.5"/><path d="M8 12H4.5v15h15V12H16"/></svg>',
 back:'<svg width="30" height="50" viewBox="0 0 16 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M13 2 3 14l10 12"/></svg>',
 fwd:'<svg width="30" height="50" viewBox="0 0 16 28" fill="none" stroke="#b8b8bd" stroke-width="2.6" stroke-linecap="round"><path d="m3 2 10 12L3 26"/></svg>',
 book:'<svg width="50" height="44" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 5C10 2 5 2 2 3v18c3-1 8-1 12 2 4-3 9-3 12-2V3c-3-1-8-1-12 2zM14 5v18"/></svg>',
 tabs:'<svg width="46" height="46" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="17" height="17" rx="3"/><path d="M7 2h14a3 3 0 0 1 3 3v14"/></svg>',
 lock:'<svg width="20" height="26" viewBox="0 0 14 18" fill="#666"><rect x="1" y="8" width="12" height="9" rx="2"/><path d="M4 8V5a3 3 0 0 1 6 0v3" stroke="#666" stroke-width="2" fill="none"/></svg>',
 plus:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
 copy:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
 bm:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6C9 4 5 4 3 5v14c2-1 6-1 9 1 3-2 7-2 9-1V5c-2-1-6-1-9 1z"/></svg>',
 star:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.2.9-4.5 4.4 1 6.1L12 17l-5.5 3 1-6.1L3 9.5l6.2-.9z"/></svg>',
 find:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>'
};
let C, PH;
function makePhone(){
  const d=C.dir, P=document.createElement('div'); P.className='phone';
  P.innerHTML=`<div class="scr">
   <div class="lay L0"><div class="page"><img src="${C.shot}"></div>
     <div class="bar"><div class="url tgt" data-t="0">${I.lock}<span>sawaaap.com</span><div class="tap"></div></div>
       <div class="tools"><span>${I.back}</span><span>${I.fwd}</span><span class="tgt" data-t="1">${I.share}<div class="tap"></div></span><span>${I.book}</span><span>${I.tabs}</span></div></div></div>
   <div class="lay L2" dir="${d}"><div class="dim"></div><div class="sheet"><div class="shead"><img src="${C.logo}"><div><b>${C.brand}</b><small>sawaaap.com</small></div></div>
     <div class="apps"><i></i><i></i><i></i><i></i></div>
     <div class="grp">${C.rows.map((r,i)=>`<div class="row${i===3?' hl tgt':''}" ${i===3?'data-t="2"':''}><span>${r}</span><span class="ic">${I[['copy','bm','star','plus','find'][i]]}</span>${i===3?'<div class="tap"></div>':''}</div>`).join('')}</div></div></div>
   <div class="lay L3" dir="${d}"><div class="addp"><div class="nav"><span>${C.cancel}</span><b>${C.rows[3]}</b><span class="tgt" data-t="3" style="font-weight:700">${C.add}<div class="tap"></div></span></div>
     <div class="card"><img src="${C.logo}"><div class="f"><div>${C.brand}</div><small>https://www.sawaaap.com</small></div></div>
     <div class="tog"><span>${C.webapp}</span><span class="sw"></span></div></div></div>
   <div class="lay L4"><div class="home"><div class="grid">${Array.from({length:11},()=>'<div class="app"><i></i><span>&nbsp;</span></div>').join('')}<div class="app sawa"><img src="${C.logo}"><span>${C.brand}</span></div></div><div class="dock"><i></i><i></i><i></i><i></i></div></div></div>
  </div><div class="status"><span>9:41</span><span>▮▮▮ ◔</span></div><div class="island"></div>`;
  return P;
}
// state k: 0 open,1 share,2 sheet row,3 add,4 home. lt = seconds since state start
function apply(P,k,lt){
  const q=s=>P.querySelector(s);
  const sh=k===2?ease(prog(lt,0.1,0.7)):k>2?1:0;
  q('.L0').style.display=k<=2?'block':'none';
  q('.L2').style.display=k===2?'block':'none';
  q('.L2 .dim').style.opacity=sh; q('.L2 .sheet').style.transform=`translateY(${(1-sh)*920}px)`;
  const ad=k===3?ease(prog(lt,0.1,0.7)):1;
  q('.L3').style.display=k===3?'block':'none'; q('.L3').style.transform=`translateY(${(1-ad)*1300}px)`;
  q('.L4').style.display=k===4?'block':'none';
  const ic=q('.sawa'); const p=k===4?back(prog(lt,0.3,0.9)):1; ic.style.transform=`scale(${p})`; ic.style.opacity=clamp(p);
  P.querySelectorAll('.tap').forEach(e=>{
    const tk=+e.parentNode.dataset.t; if(tk!==k){e.style.opacity=0;return;}
    const a=k>=2?1.0:0.5, v=prog(lt,a,a+0.3);
    const pulse=(Math.sin((lt-a)*7)+1)/2;
    e.style.opacity=v*(1-prog(lt,3.1,3.4)); e.style.transform=`scale(${0.85+0.25*pulse})`;
  });
}
function setup(cfg,mode){
  C=cfg; document.body.className=mode||''; document.documentElement.lang=cfg.lang; ['#vid','#img'].forEach(s=>$(s).dir=cfg.dir);
  document.querySelectorAll('.logo').forEach(i=>i.src=cfg.logo);
  if(mode==='still'){
    $('#ihead h1').textContent=cfg.title; $('#ihead p').textContent=cfg.sub;
    $('#cells').innerHTML=cfg.steps.map((s,k)=>`<div class="cell"><div class="cap"><div class="num">${cfg.nums[k]}</div><div><b>${s[0]}</b><small>${s[1]}</small></div></div><div class="wrap"></div></div>`).join('');
    document.querySelectorAll('.cell .wrap').forEach((w,k)=>{const P=makePhone(); w.appendChild(P); apply(P,k,2.0);});
    $('#ifoot').innerHTML=cfg.foot;
  } else {
    $('#intro h1').textContent=cfg.title; $('#intro p').textContent=cfg.sub;
    $('#hdr').innerHTML=cfg.steps.map((s,k)=>`<div class="st"><div class="num">${cfg.nums[k]}</div><h2>${s[0]}</h2><p>${s[1]}</p></div>`).join('');
    $('#dots').innerHTML='<i></i><i></i><i></i><i></i>';
    PH=makePhone(); $('#stage').appendChild(PH);
    const O=makePhone(); $('#outro .ph').appendChild(O); apply(O,4,0); O.id='ophone';
    $('#outro h2').textContent=cfg.endT; $('#outro p').textContent=cfg.endS; $('#outro .cta').textContent=cfg.cta;
  }
  return document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>0))));
}
const S0=2.6, SD=3.5, END=S0+4*SD;   // steps 2.6–16.6, outro to 20s
function render(t){
  $('#bg').style.transform=`translate(${Math.sin(t/3)*40}px,${Math.cos(t/4)*50}px)`;
  const ii=ease(prog(t,0.1,0.7)), io=ease(prog(t,2.1,2.6));
  $('#intro').style.opacity=ii*(1-io); $('#intro img').style.transform=`scale(${back(prog(t,0.1,0.8))})`;
  const k=Math.floor((t-S0)/SD), lt=t-S0-k*SD, inSteps=t>=S0&&t<END;
  const pin=ease(prog(t,S0-0.3,S0+0.4)), pout=ease(prog(t,END-0.2,END+0.3));
  PH.style.opacity=pin*(1-pout); PH.style.transform=`translateY(${(1-pin)*700}px)`;
  if(inSteps) apply(PH,k,lt);
  document.querySelectorAll('.st').forEach((s,i)=>{const v=i===k&&inSteps?ease(prog(lt,0,0.35))*(1-ease(prog(lt,SD-0.25,SD))):0; s.style.opacity=v; s.style.transform=`translateY(${(1-v)*30}px)`;});
  $('#dots').style.opacity=inSteps?pin:0;
  document.querySelectorAll('#dots i').forEach((d,i)=>d.className=i===k?'on':'');
  const oi=prog(t,END+0.1,END+0.7); $('#outro').style.opacity=ease(oi);
  apply($('#ophone'),4,t-END-0.2);
  ['#outro h2','#outro p'].forEach((s,i)=>{const v=ease(prog(t,END+0.9+i*0.3,END+1.5+i*0.3)); $(s).style.opacity=v; $(s).style.transform=`translateY(${(1-v)*30}px)`;});
  const c=back(prog(t,END+1.8,END+2.4)); $('#outro .cta').style.opacity=clamp(c); $('#outro .cta').style.transform=`scale(${c})`;
}
</script>
</body>
</html>

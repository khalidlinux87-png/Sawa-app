<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>دفع فاتورة · سوا</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  /* C267: the public pay page. Standalone (no app, no login). The token in the path picks the invoice. */
  @font-face{font-family:'Sawa Plex';font-weight:100 500;font-display:swap;src:url(/fonts/plex-arabic-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Sawa Plex';font-weight:100 500;font-display:swap;src:url(/fonts/plex-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
  @font-face{font-family:'Sawa Plex';font-weight:600 900;font-display:swap;src:url(/fonts/plex-arabic-700.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Sawa Plex';font-weight:600 900;font-display:swap;src:url(/fonts/plex-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
  :root{--teal:#2774BA;--ink:#111827;--muted:#6B7280;--paper:#F5F7FA;--card:#FFFFFF;--line:#E2E5E9;--amber:#B45309;--red:#B42318;--green:#1B7A43;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#5AA9E6;--ink:#EDEFF2;--muted:#8A93A0;--paper:#0E1116;--card:#171B21;--line:#262B33;--amber:#F5B14C;--red:#E5695C;--green:#5CD692;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 'Sawa Plex',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  main{max-width:520px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  header img{max-height:44px;max-width:120px;object-fit:contain;border-radius:6px;background:#fff;padding:2px}
  header .who{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{font:inherit;cursor:pointer}
  .lang{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;min-height:36px;padding:0 12px;font-size:13px}
  h1{font-size:30px;line-height:1.3;font-weight:800;margin:0 0 8px}
  .sub{color:var(--muted);margin:0}
  .sub.red{color:var(--red)}
  .note{margin:24px 0 0;padding:12px 0 0;border-top:1px solid var(--line);color:var(--amber)}
  .note.ok{color:var(--green)}
  h2{font-size:17px;font-weight:800;margin:36px 0 12px}
  .acct{padding:14px 0;border-top:1px solid var(--line)}
  .acct:first-of-type{border-top:0}
  .acct b{display:block;font-size:16px}
  .row{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted)}
  .row .v{color:var(--ink);flex:1;min-width:0;overflow-wrap:anywhere}
  .copy{border:1px solid var(--line);background:var(--card);color:var(--teal);border-radius:10px;min-height:36px;padding:0 12px;font-weight:700;font-size:13px}
  .ref{margin-top:14px;font-size:14px;color:var(--muted)}
  .items{width:100%;border-collapse:collapse;font-size:14px}
  .items td{padding:6px 0;vertical-align:top}
  .items td:last-child{text-align:end}
  .items tr.total td{border-top:1px solid var(--line);font-weight:800;padding-top:10px}
  .link{background:none;border:0;color:var(--teal);font-weight:700;padding:8px 0;min-height:40px}
  form{display:grid;gap:14px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted)}
  input,select{display:block;width:100%;margin-top:6px;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .primary{min-height:52px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:16px}
  .primary[disabled]{opacity:.5;cursor:default}
  .err{color:var(--red);font-size:14px;margin:0}
  .hint{font-weight:400;font-size:12px;color:var(--muted)}
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:stretch;justify-content:center;z-index:5}
  #sheet.on{display:flex}
  #sheet .box{background:#fff;width:100%;max-width:820px;display:flex;flex-direction:column}
  #sheet .bar{display:flex;gap:8px;padding:10px;background:var(--card);border-bottom:1px solid var(--line)}
  #sheet iframe{flex:1;border:0;width:100%;background:#fff}
  footer{margin-top:48px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:inherit}
  .skel{color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){.fresh{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="skel">…</p></main>
<div id="sheet" role="dialog" aria-modal="true" aria-label="الفاتورة"><div class="box"><div class="bar">
  <button class="copy" id="printBtn" type="button"></button><span style="flex:1"></span><button class="copy" id="closeBtn" type="button"></button></div>
  <iframe id="frame" title="invoice"></iframe></div></div>
<script>
(function () {
  "use strict";
  // Fixed on purpose: a link can never point this page at another server (that would let a crafted URL on our domain show fake account numbers).
  var API = "https://sawa-deploy-test.khalidlinux87.workers.dev/pfm/pay";
  var TOKEN = (location.pathname.split("/pay/")[1] || "").replace(/\/+$/, "");
  var app = document.getElementById("app");
  var state = { v: null, lang: null, sending: false, err: "", first: true };
  var STRINGS = {
    ar: { owe: "مطلوب منك ", from: "فاتورة {n} من {i}", due: "، تستحقّ في {d}.", overdue: "، كان استحقاقها في {d}.", paidAll: "دُفعت هذه الفاتورة كاملةً.", thanks: "شكراً لك.",
      cancelled: "أُلغيت هذه الفاتورة.", noLink: "هذا الرابط غير صحيح أو انتهى.", tryLater: "تعذّر التحميل. تحقّق من الاتصال وأعد المحاولة.", retry: "إعادة المحاولة",
      payTo: "ادفع إلى", holder: "صاحب الحساب", number: "رقم الحساب", phone: "رقم المحفظة", branch: "الفرع", copy: "نسخ", copied: "نُسخ",
      reference: "اكتب {n} في خانة البيان أو الملاحظة عند التحويل.", noAccounts: "لم يضف المُصدِر حسابات دفع لهذه الفاتورة. تواصل معه مباشرة.",
      details: "تفاصيل الفاتورة", total: "الإجماليّ", paid: "المدفوع", view: "عرض الفاتورة كاملةً أو طباعتها", print: "طباعة أو PDF", close: "إغلاق",
      claimH: "دفعتَ؟ أبلغ {i}", name: "اسمك", phoneOpt: "هاتفك (اختياريّ)", amount: "المبلغ الذي حوّلته", account: "إلى أيّ حساب", refOpt: "رقم العمليّة أو المرجع (اختياريّ)",
      date: "تاريخ التحويل", proof: "صورة الإيصال (اختياريّ)", proofHint: "تُصغَّر على جهازك قبل الإرسال", send: "أبلغ عن الدفع", sending: "جارٍ الإرسال…",
      sent: "وصل بلاغك. سيتحقّق {i} من حسابه ويؤكّد الدفعة.", pending: "بلاغات دفعٍ بانتظار تأكيد المُصدِر: {a}", fixed: "المبلغ كاملاً (لا تُقبل دفعات جزئيّة)",
      errs: { overpay: "المبلغ أكبر من المتبقّي بعد البلاغات السابقة.", partial_not_allowed: "هذه الفاتورة تُدفع كاملةً دفعةً واحدة.", claim_pending: "هناك بلاغاتٌ سابقة لم يُردّ عليها بعد. انتظر رداً من المُصدِر.",
        rate_limited: "محاولاتٌ كثيرة. انتظر قليلاً ثمّ أعد المحاولة.", bad_payer: "اكتب اسمك.", bad_amount: "اكتب المبلغ.", too_precise: "عدد الخانات العشريّة أكثر من المسموح.", bad_proof: "الصورة يجب أن تكون JPEG أو PNG أو WebP.",
        not_payable: "لم تعد هذه الفاتورة تقبل الدفع.", bad_account: "اختر الحساب الذي حوّلت إليه." },
      footer: "فواتير عبر سوا.", privacy: "الخصوصيّة", lang: "English" },
    en: { owe: "You owe ", from: "Invoice {n} from {i}", due: ", due on {d}.", overdue: ", which was due on {d}.", paidAll: "This invoice is paid in full.", thanks: "Thank you.",
      cancelled: "This invoice was cancelled.", noLink: "This link isn't valid or has expired.", tryLater: "Couldn't load. Check your connection and try again.", retry: "Try again",
      payTo: "Pay to", holder: "Account holder", number: "Account number", phone: "Wallet number", branch: "Branch", copy: "Copy", copied: "Copied",
      reference: "Put {n} in the transfer's reference or note.", noAccounts: "The issuer added no payment accounts to this invoice. Contact them directly.",
      details: "Invoice details", total: "Total", paid: "Paid", view: "View or print the full invoice", print: "Print or PDF", close: "Close",
      claimH: "Paid? Let {i} know", name: "Your name", phoneOpt: "Your phone (optional)", amount: "Amount you sent", account: "To which account", refOpt: "Transaction number or reference (optional)",
      date: "Date of the transfer", proof: "Photo of the receipt (optional)", proofHint: "Shrunk on your device before sending", send: "Report payment", sending: "Sending…",
      sent: "Your report arrived. {i} will check their account and confirm the payment.", pending: "Payment reports waiting for the issuer: {a}", fixed: "The full amount (no part payments)",
      errs: { overpay: "That's more than is left after earlier reports.", partial_not_allowed: "This invoice is paid in one full payment.", claim_pending: "Earlier reports haven't been answered yet. Wait for the issuer.",
        rate_limited: "Too many attempts. Wait a little and try again.", bad_payer: "Enter your name.", bad_amount: "Enter the amount.", too_precise: "Too many decimal places.", bad_proof: "The image must be JPEG, PNG or WebP.",
        not_payable: "This invoice no longer accepts payment.", bad_account: "Choose the account you sent to." },
      footer: "Invoices with Sawa.", privacy: "Privacy", lang: "العربيّة" }
  };
  function S() { return STRINGS[state.lang]; }
  function fill(s, o) { return s.replace(/\{(\w)\}/g, function (_, k) { return o[k] != null ? o[k] : ""; }); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function loc() { return state.lang === "ar" ? "ar-u-nu-latn" : "en"; }
  function money(minor, cur) {
    var e = 2; try { e = new Intl.NumberFormat("en", { style: "currency", currency: cur }).resolvedOptions().maximumFractionDigits; } catch (x) {}
    var f; try { f = new Intl.NumberFormat(loc(), { style: "currency", currency: cur, currencyDisplay: state.lang === "ar" ? "symbol" : "code" }); } catch (x) { f = new Intl.NumberFormat("en"); }
    return '<bdi class="num">' + esc(f.format(minor / Math.pow(10, e)).replace(/[‎‏؜]/g, "")) + "</bdi>";
  }
  function day(d) { var p = d.split("-").map(Number); return new Intl.DateTimeFormat(loc(), { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }).format(Date.UTC(p[0], p[1] - 1, p[2])); }
  function api(op, payload) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ op: op, payload: payload }), referrerPolicy: "no-referrer" })
      .then(function (r) { return r.json(); }).then(function (b) { if (!b || !b.ok) throw new Error((b && b.error) || "error"); return b; });
  }
  var KEY = "sawa_pay_" + TOKEN;   // remembers this browser's report, to show it again after a reload
  function mine() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }

  function setLang(l) {
    state.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.title = l === "ar" ? "دفع فاتورة · سوا" : "Pay an invoice · Sawa";
    render();
  }

  function render() {
    var v = state.v, t = S();
    if (!v) return;
    var h = [];
    h.push('<header>' + (v.issuer.logo ? '<img src="' + esc(v.issuer.logo) + '" alt="">' : "") + '<span class="who" dir="auto">' + esc(v.issuer.name) + '</span>' +
      '<button class="lang" type="button" id="langBtn">' + t.lang + "</button></header>");
    var from = fill(t.from, { n: '<bdi class="num">' + esc(v.number) + "</bdi>", i: "<bdi>" + esc(v.issuer.name) + "</bdi>" });
    if (v.status === "paid") { h.push('<h1 class="' + (state.first ? "fresh" : "") + '">' + t.paidAll + "</h1>"); h.push('<p class="sub">' + from + ". " + t.thanks + "</p>"); }
    else if (v.status === "cancelled") { h.push('<h1 class="' + (state.first ? "fresh" : "") + '">' + t.cancelled + "</h1>"); h.push('<p class="sub">' + from + ".</p>"); }
    else {
      h.push('<h1 class="' + (state.first ? "fresh" : "") + '">' + t.owe + money(v.amountDue, v.currency) + "</h1>");
      var late = v.status === "overdue";
      h.push('<p class="sub' + (late ? " red" : "") + '">' + from + fill(late ? t.overdue : t.due, { d: day(v.dueDate) }) + "</p>");
    }
    var m = mine();
    if (m && v.payable) h.push('<p class="note ok" role="status">' + fill(t.sent, { i: "<bdi>" + esc(v.issuer.name) + "</bdi>" }) + "</p>");
    else if (v.pendingClaims > 0 && v.payable) h.push('<p class="note">' + fill(t.pending, { a: money(v.pendingClaims, v.currency) }) + "</p>");

    if (v.payable) {
      h.push("<h2>" + t.payTo + "</h2>");
      if (!v.accounts.length) h.push('<p class="sub">' + t.noAccounts + "</p>");
      v.accounts.forEach(function (a, i) {
        var title = a.bankName || a.provider || a.label;
        h.push('<div class="acct"><b dir="auto">' + esc(title) + "</b>" +
          (a.holderName ? '<div class="row"><span>' + t.holder + '</span><span class="v" dir="auto">' + esc(a.holderName) + "</span></div>" : "") +
          (a.number ? '<div class="row"><span>' + (a.type === "mobile_money" ? t.phone : t.number) + '</span><span class="v num">' + esc(a.number) + '</span><button class="copy" type="button" data-copy="' + esc(a.number) + '">' + t.copy + "</button></div>" : "") +
          (a.branch ? '<div class="row"><span>' + t.branch + '</span><span class="v" dir="auto">' + esc(a.branch) + "</span></div>" : "") +
          (a.details ? '<div class="row"><span class="v" dir="auto">' + esc(a.details) + "</span></div>" : "") + "</div>");
      });
      if (v.accounts.length) h.push('<p class="ref">' + fill(t.reference, { n: '<bdi class="num">' + esc(v.number) + "</bdi>" }) + ' <button class="copy" type="button" data-copy="' + esc(v.number) + '">' + t.copy + "</button></p>");
    }

    h.push("<h2>" + t.details + '</h2><table class="items">');
    v.items.forEach(function (it) { h.push('<tr><td dir="auto">' + esc(it.description) + ' <span class="num" style="color:var(--muted)">× ' + esc(it.qty) + "</span></td><td>" + money(it.amount, v.currency) + "</td></tr>"); });
    if (v.taxTotal) h.push("<tr><td>" + esc(v.taxLabel || (state.lang === "ar" ? "الضريبة" : "Tax")) + "</td><td>" + money(v.taxTotal, v.currency) + "</td></tr>");
    h.push('<tr class="total"><td>' + t.total + "</td><td>" + money(v.total, v.currency) + "</td></tr>");
    if (v.amountPaid) h.push("<tr><td>" + t.paid + "</td><td>−" + money(v.amountPaid, v.currency) + "</td></tr>");
    h.push('</table><button class="link" type="button" id="viewBtn">' + t.view + "</button>");

    if (v.payable && v.accounts.length && !m) {
      var room = v.amountDue - (v.pendingClaims || 0), e = 2;
      try { e = new Intl.NumberFormat("en", { style: "currency", currency: v.currency }).resolvedOptions().maximumFractionDigits; } catch (x) {}
      var today = new Date().toISOString().slice(0, 10);
      h.push("<h2>" + fill(t.claimH, { i: "<bdi>" + esc(v.issuer.name) + "</bdi>" }) + "</h2>");
      h.push('<form id="claim" novalidate>' +
        '<label>' + t.name + '<input name="name" autocomplete="name" required maxlength="80" dir="auto"></label>' +
        '<label>' + t.phoneOpt + '<input name="phone" type="tel" autocomplete="tel" maxlength="30" dir="ltr"></label>' +
        '<label>' + t.amount + " (" + esc(v.currency) + ")" + (v.allowPartial ? "" : ' <span class="hint">' + t.fixed + "</span>") +
          '<input name="amount" inputmode="decimal" dir="ltr" value="' + (room / Math.pow(10, e)).toFixed(e) + '"' + (v.allowPartial ? "" : " readonly") + "></label>" +
        (v.accounts.length > 1 ? '<label>' + t.account + '<select name="account">' + v.accounts.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc((a.bankName || a.provider || a.label) + (a.number ? " " + a.number.slice(-4) : "")) + "</option>"; }).join("") + "</select></label>"
          : '<input type="hidden" name="account" value="' + esc(v.accounts[0].id) + '">') +
        '<label>' + t.refOpt + '<input name="reference" maxlength="80" dir="auto"></label>' +
        '<label>' + t.date + '<input name="date" type="date" max="' + today + '" value="' + today + '"></label>' +
        '<label>' + t.proof + ' <span class="hint">' + t.proofHint + '</span><input name="proof" type="file" accept="image/jpeg,image/png,image/webp"></label>' +
        (state.err ? '<p class="err" role="alert">' + esc(state.err) + "</p>" : "") +
        '<button class="primary" type="submit"' + (state.sending ? " disabled" : "") + ">" + (state.sending ? t.sending : t.send) + "</button></form>");
    }
    h.push("<footer>" + t.footer + ' <a href="/privacy.html">' + t.privacy + "</a></footer>");
    app.innerHTML = h.join("");
    state.first = false;   // the headline animates once, on first load only
    bind();
  }

  function bind() {
    var lb = document.getElementById("langBtn"); if (lb) lb.onclick = function () { setLang(state.lang === "ar" ? "en" : "ar"); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (b) {
      b.onclick = function () { var t = S(), v = b.getAttribute("data-copy");
        (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { b.textContent = t.copied; setTimeout(function () { b.textContent = t.copy; }, 1500); }, function () {}); };
    });
    var vb = document.getElementById("viewBtn"); if (vb) vb.onclick = openInvoice;
    var f = document.getElementById("claim"); if (f) f.onsubmit = submit;
  }

  // the full invoice, rendered by the server, in a sandboxed frame (no scripts) that can still be printed
  function openInvoice() {
    var sh = document.getElementById("sheet"), fr = document.getElementById("frame"), t = S();
    document.getElementById("printBtn").textContent = t.print; document.getElementById("closeBtn").textContent = t.close;
    api("pay.view", { token: TOKEN, lang: state.lang }).then(function (b) {
      fr.setAttribute("sandbox", "allow-modals allow-same-origin"); fr.srcdoc = b.html; sh.classList.add("on");
      document.getElementById("closeBtn").focus();
    }, function () {});
  }
  document.getElementById("closeBtn").onclick = function () { document.getElementById("sheet").classList.remove("on"); var vb = document.getElementById("viewBtn"); if (vb) vb.focus(); };
  document.getElementById("printBtn").onclick = function () { try { var w = document.getElementById("frame").contentWindow; w.focus(); w.print(); } catch (e) {} };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") document.getElementById("closeBtn").click(); });

  function shrink(file) {   // ≤ 1280 px JPEG, so a phone photo of a receipt stays small
    return new Promise(function (res, rej) {
      var img = document.createElement("img"), url = URL.createObjectURL(file);
      img.onload = function () { var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.8)); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("bad_proof")); };
      img.src = url;
    });
  }
  function key() { try { return crypto.randomUUID(); } catch (e) { return "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); } }
  var idem = key();
  function submit(ev) {
    ev.preventDefault();
    var f = ev.target, t = S();
    var p = { token: TOKEN, idemKey: idem, amount: f.amount.value.trim(), payoutAccountId: f.account.value, reference: f.reference.value.trim() || null,
      paidAt: f.date.value || null, payer: { name: f.name.value.trim(), phone: f.phone.value.trim() || null } };
    if (!p.payer.name) { state.err = t.errs.bad_payer; render(); f = document.getElementById("claim"); f.name.focus(); return; }
    var file = f.proof.files && f.proof.files[0];
    var keep = { name: f.name.value, phone: f.phone.value, amount: f.amount.value, reference: f.reference.value, date: f.date.value };
    state.sending = true; state.err = ""; render(); restore(keep);
    (file ? shrink(file) : Promise.resolve(null)).then(function (proof) { if (proof) p.proof = proof; return api("pay.claim", p); }).then(function () {
      try { localStorage.setItem(KEY, JSON.stringify({ at: Date.now() })); } catch (e) {}
      state.sending = false; return load();
    }, function (e) {
      var code = String(e.message || "").split(":")[0];
      state.sending = false; state.err = t.errs[code] || t.tryLater; render(); restore(keep);
    });
  }
  function restore(k) { var f = document.getElementById("claim"); if (!f) return; ["name", "phone", "amount", "reference", "date"].forEach(function (n) { if (k[n] != null && f[n] && !f[n].readOnly) f[n].value = k[n]; }); }

  function fail(msg, retry) {
    app.innerHTML = "<h1>" + esc(msg) + "</h1>" + (retry ? '<button class="primary" type="button" id="again">' + S().retry + "</button>" : "");
    var b = document.getElementById("again"); if (b) b.onclick = load;
  }
  function load() {
    return api("pay.view", { token: TOKEN }).then(function (v) { state.v = v; if (!state.lang) state.lang = v.lang === "en" ? "en" : "ar"; setLang(state.lang); },
      function (e) { if (!state.lang) state.lang = (navigator.language || "ar").slice(0, 2) === "ar" ? "ar" : "en";
        /^not_found/.test(e.message) ? fail(S().noLink) : fail(S().tryLater, true); });
  }
  if (!/^[a-z0-9]{22}$/.test(TOKEN)) { state.lang = (navigator.language || "ar").slice(0, 2) === "ar" ? "ar" : "en"; fail(S().noLink); }
  else load();
})();
</script>

<style>
  html,body,#root{height:100%;margin:0;background:#F5F7FA;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
  /* شاشة التحميل */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:#F5F7FA;z-index:9999;transition:opacity .3s}
  #boot img{width:104px;height:104px}
  #boot p{color:#6B7280;font-size:13px;margin:0}
  .spin{width:26px;height:26px;border:3px solid #BFE0F5;border-top-color:#2F80C8;
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{display:none;position:fixed;inset:0;padding:28px;background:#F5F7FA;z-index:10000;
    overflow:auto;direction:rtl;text-align:right}
  #err h2{color:#C0392B;font-size:17px}
  #err pre{background:#fff;padding:14px;border-radius:12px;font-size:11px;
    white-space:pre-wrap;word-break:break-word;border:1px solid #E2E5E9;direction:ltr;text-align:left}
</style>
</head>

<script>
  // التقاط أي خطأ وعرضه بدل شاشة بيضاء
  function showError(msg){
    document.getElementById('boot').style.display='none';
    document.getElementById('err').style.display='block';
    document.getElementById('errmsg').textContent=String(msg);
  }
  window.addEventListener('error',e=>showError(e.message+'\n'+(e.filename||'')+':'+(e.lineno||'')));
  window.addEventListener('unhandledrejection',e=>showError('Promise: '+e.reason));

  // تسجيل عامل الخدمة
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>

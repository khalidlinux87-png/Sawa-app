  // التقاط أي خطأ وعرضه بدل شاشة بيضاء
  function showError(msg){
    document.getElementById('boot').style.display='none';
    document.getElementById('err').style.display='block';
    document.getElementById('errmsg').textContent=String(msg);
  }
  window.addEventListener('error',e=>showError(e.message+'\n'+(e.filename||'')+':'+(e.lineno||'')));
  window.addEventListener('unhandledrejection',e=>showError('Promise: '+e.reason));

  // تسجيل عامل الخدمة
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>

     يُتحقَّق منها ثمّ تُجمَع الأجزاء وتُشغَّل نصّاً واحداً مطابقاً للأصل. -->
<script>
(function () {
  var N = 9, KEY = "sawa_heal";
  var ar = (function () { try { return (localStorage.getItem("sawaLang") || "ar") === "ar"; } catch (e) { return true; } })();
  function show(detail) {
    var b = document.getElementById("boot"); if (!b) return;
    var box = document.createElement("div");
    box.style.cssText = "text-align:center;font:600 14px system-ui;color:#374151;max-width:300px;line-height:1.7";
    box.innerHTML = (ar ? "تعذّر تحميل التطبيق كاملاً.<br>تحقّق من الاتصال ثمّ أعد المحاولة."
                        : "The app couldn't load completely.<br>Check your connection and try again.") +
      '<div style="font:500 11px system-ui;color:#9CA3AF;margin-top:6px;direction:ltr">' + detail + "</div>" +
      '<button style="margin-top:12px;padding:10px 18px;border:none;border-radius:12px;background:#2F80C8;color:#fff;font:700 14px system-ui">' +
      (ar ? "إعادة المحاولة" : "Try again") + "</button>";
    box.querySelector("button").onclick = function () { location.reload(); };
    b.appendChild(box);
  }
  // فشلٌ أوّل: نحذف مخازن «سوا» ونلغي عامل الخدمة ونعيد التحميل مرّة. فشلٌ ثانٍ: رسالةٌ واضحة.
  // لا يمسّ localStorage ولا تسجيل الدخول.
  function fail(detail) {
    var tried = false;
    try { tried = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
    if (tried) { try { sessionStorage.removeItem(KEY); } catch (e) {} show(detail); return; }
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    var jobs = [];
    try {
      if (window.caches) jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.filter(function (k) { return k.indexOf("sawa-") === 0; }).map(function (k) { return caches.delete(k); }));
      }));
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    } catch (e) {}
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  }
  var partsP = window.__sawaParts || (function () {
    var jobs = [];
    for (var i = 1; i <= N; i++) (function (k) {
      var url = "./app.p" + k + ".js", mark = "//@@sawa-part:" + k + "\n";
      jobs.push(fetch(url, { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error("app.p" + k + ".js: HTTP " + r.status);
        return r.text();
      }).then(function (t) {
        if (t.slice(-mark.length) !== mark) throw new Error("app.p" + k + ".js " + (ar ? "ناقص — أعد رفعه" : "incomplete — re-upload it"));
        return t.slice(0, -mark.length);
      }));
    })(i);
    return Promise.all(jobs);
  })();
  partsP.then(function (texts) {
    var s = document.createElement("script");
    s.text = texts.join("");
    document.body.appendChild(s);                 // يُنفَّذ فوراً (كما كان sawa-app.js)
    if (!window.SawaApp) throw new Error("init");
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  }).catch(function (e) { fail(String((e && e.message) || e)); });
})();
</script>

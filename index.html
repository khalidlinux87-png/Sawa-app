  /* شاشة التحميل */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:#F5F7FA;z-index:9999;transition:opacity .3s}

  #boot p{color:#6B7280;font-size:13px;margin:0}

    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{display:none;position:fixed;inset:0;padding:28px;background:#F5F7FA;z-index:10000;
    overflow:auto;direction:rtl;text-align:right}
  #err h2{color:#C0392B;font-size:17px}
  #err pre{background:#fff;padding:14px;border-radius:12px;font-size:11px;
    white-space:pre-wrap;word-break:break-word;border:1px solid #E2E5E9;direction:ltr;text-align:left}
